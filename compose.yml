name: northstar-commerce
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 8s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:4.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes: ["localstack-data:/var/lib/localstack"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(available|running)\"'"]
      interval: 6s
      timeout: 4s
      retries: 20

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { MODULE: order-service }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: ${POSTGRES_USER:-commerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8081:8081"]
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { MODULE: inventory-service }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: ${POSTGRES_USER:-commerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports: ["8082:8082"]
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { MODULE: payment-service }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: ${POSTGRES_USER:-commerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECEIPTS_ENABLED: "true"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      localstack: { condition: service_healthy }
    ports: ["8083:8083"]
    restart: unless-stopped

  storefront:
    build: ./frontend
    depends_on: [order-service, inventory-service, payment-service]
    ports: ["3000:80"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  localstack-data:
