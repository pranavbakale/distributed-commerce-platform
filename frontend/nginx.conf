server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/orders { proxy_pass http://order-service:8081; proxy_set_header Host $host; }
    location /api/products { proxy_pass http://inventory-service:8082; proxy_set_header Host $host; }
    location /api/inventory { proxy_pass http://inventory-service:8082; proxy_set_header Host $host; }
    location /api/payments { proxy_pass http://payment-service:8083; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}

